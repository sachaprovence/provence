openapi: 3.0.3
info:
  title: Autorun — API publique
  version: "1.0"
  description: >
    API publique en lecture seule (v1.0, AR-0059). Authentification par clé
    API (créée depuis Paramètres → Clés API), scopée strictement à
    l'organisation propriétaire de la clé — jamais un accès inter-organisation.
    Limitée à 60 requêtes/minute par clé (AR-0060, réponse 429 au-delà).
servers:
  - url: /api/public/v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: 'Clé API au format "ak_live_...", envoyée dans l''en-tête Authorization: Bearer <clé>.'
  schemas:
    Lead:
      type: object
      properties:
        id: { type: string }
        establishmentName: { type: string }
        category: { type: string }
        stage: { type: string }
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Opportunity:
      type: object
      properties:
        id: { type: string }
        leadId: { type: string }
        name: { type: string }
        estimatedValue: { type: integer, description: "En centimes" }
        probability: { type: integer }
        status: { type: string }
        expectedCloseAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Invoice:
      type: object
      properties:
        id: { type: string }
        leadId: { type: string }
        reference: { type: string }
        status: { type: string }
        totalAmount: { type: integer, description: "En centimes, TTC" }
        vatAmount: { type: integer, description: "En centimes" }
        dueAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }
paths:
  /leads:
    get:
      summary: Liste des prospects
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Lead" }
        "401": { description: "Clé API manquante ou invalide", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "Débit dépassé", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /leads/{id}:
    get:
      summary: Détail d'un prospect
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Lead" }
        "404": { description: "Introuvable", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /opportunities:
    get:
      summary: Liste des opportunités
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Opportunity" }
  /opportunities/{id}:
    get:
      summary: Détail d'une opportunité
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Opportunity" }
        "404": { description: "Introuvable", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /invoices:
    get:
      summary: Liste des factures
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invoice" }
  /invoices/{id}:
    get:
      summary: Détail d'une facture (avec ses lignes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Invoice" }
        "404": { description: "Introuvable", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
