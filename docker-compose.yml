services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: provence
      POSTGRES_PASSWORD: provence
      POSTGRES_DB: provence360
    ports:
      - "5432:5432"
    volumes:
      - provence_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provence -d provence360"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://provence:provence@db:5432/provence360?schema=public
      AUTH_SECRET: dev-secret-change-me
      EMAIL_PROVIDER: demo
      AI_PROVIDER: demo
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # Persistance du stockage démo (v1.2, AR-0169) — sans ce volume, les
      # fichiers écrits par STORAGE_PROVIDER=demo sont perdus à chaque
      # recréation du conteneur (voir l'alerte non bloquante documentée en
      # AR-0164 : le stockage démo n'est de toute façon jamais recommandé
      # en production réelle, voir STORAGE_PROVIDER=s3 dans .env.example —
      # ce volume réduit seulement le risque pour un usage démo/interne).
      - provence_storage_demo:/app/storage-demo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Arrêt propre (v1.3, AR-0173) : `next start` (App Router) termine les
    # requêtes en cours et les callbacks `after()` en attente sur SIGTERM
    # avant de quitter (voir doc Next.js self-hosting) ; Docker Compose
    # attend ce délai avant d'envoyer SIGKILL. 30s = borne haute de la
    # période de "drain" recommandée (10-30s) — mieux vaut laisser un peu
    # de marge à une requête lente (génération PDF, appel IA) qu'interrompre
    # une écriture en cours.
    stop_grace_period: 30s

volumes:
  provence_db_data:
  provence_storage_demo:
