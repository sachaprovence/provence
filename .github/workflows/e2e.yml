name: E2E

# Rejoue les 6 suites E2E (golden path, isolation multi-tenant, Automation
# Engine, onboarding self-service, Compta Vellano, Personal Quest AI) contre
# une instance réellement démarrée et seedée — sur chaque pull request ET
# après merge sur `main` (v0.10, AR-0157 : auparavant seul golden-path.mjs
# tournait, et uniquement après merge — une régression du parcours principal
# ou de l'isolation multi-tenant n'était donc détectée qu'APRÈS avoir
# atteint `main`). Voir ROADMAP.md MOD-00 / BACKLOG.md AR-0002. La suite
# onboarding (v1.0, AR-0064/AR-0066) a été ajoutée pour couvrir le parcours
# d'inscription self-service de bout en bout, y compris le provisionnement
# automatique de l'abonnement. La suite Compta Vellano (ADR 0048) couvre le
# module de comptabilité pizzeria isolé du CRM. La suite Personal Quest AI
# (ADR 0049) couvre la boucle cœur objectif → jalons → quêtes → sélection →
# validation → XP → adaptation → assistant.

on:
  push:
    branches: [main]
    paths-ignore:
      - "provence360-squarespace/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "provence360-squarespace/**"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provence
          POSTGRES_PASSWORD: provence
          POSTGRES_DB: provence360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provence -d provence360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://provence:provence@localhost:5432/provence360?schema=public
      AUTH_SECRET: ci-secret-not-for-production-0000000000
      AI_PROVIDER: demo
      EMAIL_PROVIDER: demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Start application
        run: npx next start -p 3000 &

      - name: Wait for the application to be ready
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/login > /dev/null; then
              echo "Application is up."
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become ready in time." >&2
          exit 1

      - name: Run golden path
        run: npm run test:e2e

      - name: Run tenant isolation E2E
        run: npm run test:e2e:tenants

      - name: Run Automation Engine E2E
        run: npm run test:e2e:automation

      - name: Run self-service onboarding E2E
        run: npm run test:e2e:onboarding

      - name: Run Compta Vellano E2E
        run: npm run test:e2e:compta

      - name: Run Personal Quest AI E2E
        run: npm run test:e2e:quest
