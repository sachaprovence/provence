name: CI

# Lint, typecheck, tests unitaires et build sur chaque pull request touchant
# l'application (voir ROADMAP.md MOD-00 / BACKLOG.md AR-0001). Une base
# PostgreSQL de service est fournie pour les tests qui en ont besoin (ex.
# tests/tenant-isolation/**) ; les tests qui n'en ont pas besoin (unitaires
# purs) l'ignorent simplement.

on:
  pull_request:
    paths-ignore:
      - "provence360-squarespace/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "provence360-squarespace/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provence
          POSTGRES_PASSWORD: provence
          POSTGRES_DB: provence360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provence -d provence360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://provence:provence@localhost:5432/provence360?schema=public
      AUTH_SECRET: ci-secret-not-for-production-0000000000
      AI_PROVIDER: demo
      EMAIL_PROVIDER: demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
